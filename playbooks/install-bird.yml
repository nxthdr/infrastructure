# ansible-playbook -i inventory/ --ask-become-pass playbooks/install-bird.yml
---
- hosts: core, ixp, vlt
  become: yes
  # BIRD 3 was blocked on BMP Adj-RIB-In (issue #22); 3.3.3 is the first
  # release that exports pre/post-policy correctly with `import table on`.
  # Roll out with --limit, one host first. Installing does not restart BIRD:
  # `sudo systemctl restart bird` picks up the new binary. To roll back a host,
  # re-run with `-e bird_version=2.16.1 --limit <host>` and restart.
  # The fleet runs mixed versions during the rollout, so keep configs parsable
  # by both: e.g. `authentication md5;` (wanted by BIRD 3 for the VLT
  # `password`) is a syntax error on 2.16.1.
  vars:
    bird_version: '3.3.3'
  tasks:
  - name: Install packages for compilation
    ansible.builtin.apt:
      pkg:
      - make
      - gcc
      - flex
      - bison
      - m4
      - libreadline-dev
      - libncurses-dev
      # autoconf is needed because we build from the git archive, which ships
      # configure.ac but no generated ./configure — see the next task.
      - autoconf

  # Sources come from the upstream git repository, NOT bird.network.cz.
  # As of 2026-09-14 the whole of https://bird.network.cz/download/ returns
  # HTTP 403 (the index too, and with any User-Agent), so `get_url`/`unarchive`
  # silently fetched a 0-byte file and the play failed with "Invalid archive
  # ... the file is 0 bytes". That broke BIRD installation on every new host.
  # The GitLab archive unpacks to bird-v{{ bird_version }} — note the `v` — and
  # needs `autoreconf -i` first because a git archive has no ./configure.
  - name: Download sources ({{ bird_version }})
    ansible.builtin.unarchive:
      src: 'https://gitlab.nic.cz/labs/bird/-/archive/v{{ bird_version }}/bird-v{{ bird_version }}.tar.gz'
      dest: /tmp
      remote_src: yes

  - name: Install from sources
    ansible.builtin.shell: "autoreconf -i && ./configure --with-protocols='bmp,bgp,rpki,static' && make && make install"
    args:
      chdir: '/tmp/bird-v{{ bird_version }}'

  # `bmp` is the protocol the Debian package lacks, so prove it is compiled in
  # rather than trusting the configure flag.
  - name: Verify the bmp protocol is compiled in
    ansible.builtin.shell: |
      printf 'router id 10.0.0.1;\nprotocol device {}\nprotocol bmp {\n  station address ip ::1 port 4000;\n}\n' > /tmp/bird-bmp-check.conf
      /usr/local/sbin/bird -p -c /tmp/bird-bmp-check.conf
      rm -f /tmp/bird-bmp-check.conf
    changed_when: false

  - name: Delete sources
    ansible.builtin.file:
      path: '/tmp/bird-v{{ bird_version }}'
      state: absent

  - name: Enable `net.ipv4.ip_forward`
    ansible.posix.sysctl:
      name: net.ipv4.ip_forward
      value: '1'
      sysctl_set: true
      state: present

  - name: Enable `net.ipv6.conf.all.forwarding`
    ansible.posix.sysctl:
      name: net.ipv6.conf.all.forwarding
      value: '1'
      sysctl_set: true
      state: present
