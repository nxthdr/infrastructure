# ansible-playbook -i inventory/ --ask-become-pass playbooks/install-vlt-network.yml
---
- hosts: vlt
  become: yes
  vars:
    interface: enp1s0
    # 1500, not 1420. VLT hosts sit directly on Vultr's network with no tunnel
    # (unlike the IXP hosts, where 1420 accommodates WireGuard) — `ip link` here
    # shows only enp1s0 plus docker bridges.
    #
    # 1420 actively broke this playbook: Vultr's RA advertises an IPv6 MTU of
    # 1500, and systemd-networkd cannot set an IPv6 MTU larger than the link
    # MTU, so it failed every ~40s with
    #   enp1s0: Failed to set IPv6 MTU to 1500: Invalid argument
    # and never applied the rest of this file — leaving the probing prefixes
    # without their Type=local routes. The link had been running at 1500 all
    # along (set by RA, not by us), so this matches reality rather than changing
    # it. Discovered 2026-08-03; networkd had been failing since 2026-07-16.
    mtu_size: 1500
    routing_table: 100
    routing_priority: 100
    prefixes:
      - 2a0e:97c0:8a0::/48                              # NXTHDR-RESEARCH Anycast
      - "{{ hostvars[inventory_hostname].uniprobe0 }}"  # NXTHDR-RESEARCH Unicast
    ndppd_conf_path: "/etc/ndppd.conf"
    ndppd_service_path: "/etc/systemd/system/ndppd.service"
    systemd_network_dir: "/etc/systemd/network"

  tasks:
    - name: Install required packages
      apt:
        name:
          - ndppd
          - iproute2
          - networkd-dispatcher
        state: present
        update_cache: yes

    # Debian ships `slaac private` in /etc/dhcpcd.conf, so dhcpcd adds an
    # RFC 7217 stable-private address *on top of* the kernel's EUI-64 SLAAC
    # address. Two global addresses is what takes the probing agent down:
    # caracat resolves the gateway MAC with an NDP solicitation sourced from the
    # *last* global address of the interface, Vultr's gateway ignores a
    # solicitation from an address it did not assign, and `CaracatSender::new()`
    # then blocks forever — saimiris stops sending probes at all and leaks a
    # 2 MB + 4 MB pcap ring per probe batch. (vltsgp01, 2026-08-25: 483 MB RSS,
    # 134 socket mappings, 293 fds, Host_Out_Of_Memory flapping every few
    # minutes, ~1.35M probes read and never sent; vltewr01 was one saimiris
    # restart away from the same outage, and vltcdg01 escaped only because its
    # EUI-64 address happened to sort last.) `slaac hwaddr` makes dhcpcd manage
    # the EUI-64 address instead, leaving exactly one global address to pick.
    - name: Make dhcpcd use the EUI-64 SLAAC address, not a stable-private one
      lineinfile:
        path: /etc/dhcpcd.conf
        regexp: '^\s*slaac\s+'
        line: 'slaac hwaddr'
      register: dhcpcd_slaac
      tags: [ipv6-hygiene]

    # Without this, dhcpcd keeps its old in-memory config and re-creates the
    # stable-private address within seconds of it being removed.
    - name: Reload dhcpcd so the new SLAAC mode takes effect
      command: dhcpcd --rebind {{ interface }}
      when: dhcpcd_slaac is changed
      tags: [ipv6-hygiene]

    - name: Keep only the Vultr-assigned (EUI-64) global address on {{ interface }}
      shell: |
        python3 - <<'PYSCRIPT'
        import ipaddress
        import subprocess
        import sys

        IFACE = "{{ interface }}"
        TABLE = "{{ routing_table }}"

        def ip(*args, check=True):
            return subprocess.run(["ip", *args], capture_output=True,
                                  text=True, check=check).stdout

        # The address Vultr assigns is EUI-64: the MAC with the U/L bit flipped
        # and ff:fe in the middle, which is what SLAAC derives.
        mac = open(f"/sys/class/net/{IFACE}/address").read().strip()
        octets = bytearray(int(part, 16) for part in mac.split(":"))
        octets[0] ^= 0x02
        iid = int.from_bytes(bytes(octets[:3]) + b"\xff\xfe" + bytes(octets[3:]), "big")

        listing = ip("-6", "-oneline", "addr", "show", "dev", IFACE, "scope", "global")
        addresses = [ipaddress.IPv6Interface(line.split()[3]) for line in listing.splitlines()]
        keep = [a for a in addresses if int(a.ip) & 0xFFFFFFFFFFFFFFFF == iid]
        strays = [a for a in addresses if a not in keep]

        if not keep:
            print(f"no EUI-64 address on {IFACE}, refusing to remove anything")
            sys.exit(0)
        if not strays:
            print("nothing to remove")
            sys.exit(0)

        # Repoint the policy-routing default at the address being kept *before*
        # deleting the one it currently uses as preferred source, so there is
        # never a moment where the table has no usable route.
        route = ip("-6", "route", "show", "table", TABLE, check=False)
        if route.startswith("default") and f"src {keep[0].ip} " not in route:
            gateway = route.split(" via ")[1].split()[0]
            ip("-6", "route", "replace", "default", "via", gateway, "dev", IFACE,
               "src", str(keep[0].ip), "table", TABLE)
            print(f"repointed table {TABLE} default at src {keep[0].ip}")

        for stray in strays:
            ip("-6", "addr", "del", str(stray), "dev", IFACE)
            print(f"removed {stray}")
        PYSCRIPT
      register: vlt_address_hygiene
      changed_when: "'removed ' in vlt_address_hygiene.stdout"
      tags: [ipv6-hygiene]

    # With a single global address left, default_ipv6 is unambiguous again — it
    # had picked the stray address on vltcdg01 and baked it into table 100.
    - name: Re-gather network facts after address cleanup
      setup:
        gather_subset:
          - network
      tags: [ipv6-hygiene]

    - name: Set Vultr IPv6 fact
      set_fact:
        vultr_default_ipv6: "{{ ansible_facts['default_ipv6'].address }}"
        vultr_default_macaddress: "{{ ansible_facts['default_ipv6'].macaddress }}"
      tags: [ipv6-hygiene]

    - name: Ensure systemd-networkd directory exists
      file:
        path: "{{ systemd_network_dir }}"
        state: directory
        mode: '0755'

    - name: Configure systemd-networkd for {{ interface }}
      copy:
        dest: "{{ systemd_network_dir }}/{{ interface }}.network"
        mode: '0644'
        content: |
          [Match]
          Name={{ interface }}

          [Link]
          MTUBytes={{ mtu_size }}

          [Network]
          DHCP=yes
          DHCPv6=yes
          IPv6AcceptRA=yes
          LinkLocalAddressing=yes

          [IPv6AcceptRA]
          # Derive the RA address from the MAC so it *is* the address the kernel
          # and Vultr already use, instead of networkd adding a second,
          # stable-privacy one. See the dhcpcd task above for why a second
          # global address on this interface takes the saimiris agent down.
          Token=eui64

          {% for prefix in prefixes %}
          [Route]
          Destination={{ prefix }}
          Scope=link
          Table=local
          Type=local
          {% endfor %}

    - name: Restart systemd-networkd to apply network configuration
      systemd:
        name: systemd-networkd
        state: restarted
        daemon_reload: yes

    - name: Persist sysctl settings for IPv6 forwarding & proxy NDP
      copy:
        dest: /etc/sysctl.d/99-nxthdr-ipv6.conf
        content: |
          net.ipv6.conf.all.forwarding=1
          net.ipv6.conf.all.proxy_ndp=1
          net.ipv6.conf.default.proxy_ndp=1
          net.ipv6.conf.{{ interface }}.proxy_ndp=1
          net.ipv6.ip_nonlocal_bind=1
        mode: '0644'

    - name: Apply sysctl settings
      command: sysctl --system

    # Tagged with the address cleanup: this script hardcodes an address, so it
    # goes stale the moment a stray one is removed. vltcdg01 was left pointing
    # table 100 at a deleted address, which would only have surfaced the next
    # time the table needed rebuilding.
    - name: Ensure dispatcher script for IPv6 policy routing
      tags: [ipv6-hygiene]
      copy:
        dest: /etc/networkd-dispatcher/routable.d/99-ip6-policy-routing.sh
        mode: '0755'
        owner: root
        group: root
        content: |
          #!/bin/bash
          set -e

          IFACE="{{ interface }}"
          TABLE={{ routing_table }}
          PRIORITY={{ routing_priority }}
          VULTR_IPV6="{{ vultr_default_ipv6 }}"

          # Wait up to 15 seconds for a reachable link-local gateway
          #
          # Read the token *after* "via" and stop at the first match, rather
          # than a fixed column. Vultr's RA installs three default routes here
          # and one of them carries an `nhid <id>` before `via`:
          #   default via fe80::.. proto ra metric 1002 ...
          #   default nhid 1723978110 via fe80::.. proto ra metric 1024 ...
          #   default via fe80::.. proto ra metric 1024 expires ...
          # so the previous `awk '/via/ {print $3}'` returned all three third
          # columns — including the nhid number — and `ip route add` rejected
          # the multi-line value with "inet6 address is expected rather than
          # ...". Table 100 was therefore silently never populated.
          for i in {1..15}; do
              LINKLOCAL_GW=$(ip -6 route show default dev "$IFACE" \
                  | awk '{for (i = 1; i <= NF; i++) if ($i == "via") {print $(i+1); exit}}')
              if [[ -n "$LINKLOCAL_GW" ]]; then
                  break
              fi
              echo "Waiting for default gateway on $IFACE..."
              sleep 1
          done

          if [[ -z "$LINKLOCAL_GW" ]]; then
              echo "Could not detect link-local gateway on $IFACE, aborting."
              exit 1
          fi

          # Add routing rule if missing
          if ! ip -6 rule list | grep -q "to 2000::/3.*lookup $TABLE"; then
              ip -6 rule add to 2000::/3 table $TABLE priority $PRIORITY
          fi

          # Add default route in table if missing
          if ! ip -6 route show table $TABLE | grep -q '^default '; then
              ip -6 route add default via "$LINKLOCAL_GW" dev "$IFACE" src "$VULTR_IPV6" table $TABLE
          fi

    - name: Restart networkd-dispatcher to apply routing rules
      systemd:
        name: networkd-dispatcher.service
        state: restarted

    - name: Create ndppd config
      copy:
        dest: "{{ ndppd_conf_path }}"
        mode: '0644'
        content: |
          proxy {{ interface }} {
              router no
              timeout 500
          {% for prefix in prefixes %}
              rule {{ prefix }} {
                  auto
              }
          {% endfor %}
          }

    - name: Create systemd service for ndppd
      copy:
        dest: "{{ ndppd_service_path }}"
        mode: '0644'
        content: |
          [Unit]
          Description=NDP Proxy Daemon
          After=network.target

          [Service]
          ExecStart=/usr/sbin/ndppd -c {{ ndppd_conf_path }}
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd and start ndppd
      systemd:
        daemon_reload: yes
        name: ndppd
        enabled: yes
        state: restarted

    - name: Rule to allow alloy to reach saimiris prometheus endpoint
      community.general.ufw:
        rule: allow
        port: 8080
        src: 172.18.0.0/16
        proto: tcp
