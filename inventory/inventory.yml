---
core:
  hosts:
    coreams01:
      ansible_host: ams01.core.infra.nxthdr.dev
  vars:
    ansible_user: nxthdr

ixp:
  hosts:
    ixpams01:
      ansible_host: ams01.ixp.infra.nxthdr.dev
      tailscale_ip: 100.64.0.3
    ixpams02:
      ansible_host: ams02.ixp.infra.nxthdr.dev
      tailscale_ip: 100.64.0.4
    ixpfra01:
      ansible_host: fra01.ixp.infra.nxthdr.dev
      tailscale_ip: 100.64.0.2
    ixpcdg01:
      ansible_host: cdg01.ixp.infra.nxthdr.dev
      tailscale_ip: 100.64.0.9
    ixpcdg02:
      ansible_host: cdg02.ixp.infra.nxthdr.dev
      tailscale_ip: 100.64.0.6
  vars:
    ansible_user: nxthdr

vlt:
  hosts:
    vltewr01:
      ansible_host: ewr01.vlt.infra.nxthdr.dev
      uniprobe0: 2a0e:97c0:8a3::/48
    vltcdg01:
      ansible_host: cdg01.vlt.infra.nxthdr.dev
      uniprobe0: 2a0e:97c0:8a4::/48
      # Resized in the Vultr console; 2 vCPU / 2GB / 65GB is the intended size.
      # Hosts without `plan:` use the module default (vc2-1c-1gb).
      plan: vc2-2c-2gb
    vltsgp01:
      ansible_host: sgp01.vlt.infra.nxthdr.dev
      uniprobe0: 2a0e:97c0:8a5::/48
  vars:
    ansible_user: nxthdr
