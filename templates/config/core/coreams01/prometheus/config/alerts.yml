groups:
- name: recording-rules
  interval: 30s
  rules:
  # Record all instances that have reported metrics in the last 5 minutes
  # This creates a baseline of "known" instances
  - record: instance:up:last_seen
    expr: |
      max_over_time(up[5m]) or on() vector(0)

- name: service-down
  rules:
  # Catch-all alert for any scraped service that goes down
  - alert: Service_Down
    expr: up == 0
    for: 1m
    labels:
      severity: critical
    annotations:
      title: 'service {{ $labels.job }} is down in {{ $labels.instance }}'

  # Detect services that were previously reporting but have stopped entirely
  # (covers remote_write targets like alloy and saimiris agents)
  - alert: Service_Disappeared
    expr: |
      (instance:up:last_seen == 1)
      unless on(job, instance)
      (up == 1)
    for: 3m
    labels:
      severity: warning
    annotations:
      title: 'service {{ $labels.job }} has disappeared from {{ $labels.instance }}'
      description: '{{ $labels.job }} on {{ $labels.instance }} was previously reporting metrics but has stopped for more than 3 minutes.'

- name: host
  rules:
  # Disk alerting is three tiers. The single <10% warning this replaced had no
  # trend component, so the first notification and the outage arrived together;
  # and it only watched mountpoint="/", so any future data volume would have
  # been invisible.
  #
  # Deliberately percentage-based rather than an absolute byte floor: root disks
  # on this fleet range from 9.1GB (ixpcdg01/02) to 232GB (coreams01), so any
  # single GB threshold is either constant noise on the small hosts or useless
  # on the large one. Size-independence comes from the predictive tier.
  #
  # fstype filter keeps this on real filesystems — node_exporter also reports
  # tmpfs mounts (/run, /run/user/*) which are memory and churn by design.

  # Tier 1 — lead time. The trend says this filesystem runs out within 24h.
  # Gated on being past 70% used so a transient dip on a mostly-empty disk does
  # not page, and for: 30m rides out short write bursts (compactions, pulls).
  - alert: Host_Disk_Filling
    expr: |
      (
        predict_linear(node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}[6h], 24 * 3600) < 0
        and on(instance, mountpoint)
        (
          node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}
            / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"}
        ) < 0.30
      )
    for: 30m
    labels:
      severity: warning
    annotations:
      title: 'disk {{ $labels.mountpoint }} on {{ $labels.instance }} is on track to fill within 24h'
      description: 'Based on the last 6h trend, {{ $labels.mountpoint }} on {{ $labels.instance }} runs out of space within 24 hours. Act now rather than at <10% free: check `docker system df` (unpruned images accumulate on every :main pull) and oversized container json-file logs.'

  # Tier 2 — earlier static notice than the old single 10% tier.
  - alert: Host_Disk_Low
    expr: |
      node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}
        / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"} * 100 < 20
    for: 10m
    labels:
      severity: warning
    annotations:
      title: 'disk {{ $labels.mountpoint }} on {{ $labels.instance }} is below 20% free'

  # Tier 3 — the original threshold, escalated from warning. ENOSPC on
  # coreams01 hard-fails ClickHouse, Postgres and Redpanda: Postgres can refuse
  # to start again and ClickHouse parts can be left needing repair. Not warning.
  - alert: Host_Disk_Full
    expr: |
      node_filesystem_avail_bytes{fstype=~"ext4|xfs|btrfs"}
        / node_filesystem_size_bytes{fstype=~"ext4|xfs|btrfs"} * 100 < 10
    for: 1m
    labels:
      severity: critical
    annotations:
      title: 'disk {{ $labels.mountpoint }} on {{ $labels.instance }} is almost full'

  - alert: Host_Out_Of_Memory
    expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100 < 10
    for: 2m
    labels:
      severity: warning
    annotations:
      summary: host almost out of memory in {{ $labels.instance }}

- name: peerlab
  rules:
  - alert: PeerLab_Bird_Config_Failing
    expr: node_systemd_unit_state{name="peerlab-bird-config.service",state="failed"} == 1
    for: 5m
    labels:
      severity: critical
    annotations:
      title: 'peerlab-bird-config is failing on {{ $labels.instance }}'
      description: 'The peerlab-bird-config service has been in failed state for more than 5 minutes. PeerLab prefix authorization is not being updated. Check the Headscale API key.'

- name: risotto
  rules:
  - alert: Risotto_No_BGP_Peers
    expr: absent(risotto_peer_established)
    for: 1m
    labels:
      severity: critical
    annotations:
      title: 'risotto reports no BGP peers'

  - alert: Pipeline_BMP_No_Data
    # `and on(instance)` + sum by (instance): a bare `and` requires identical
    # label sets, and the right-hand side carries a `status` label the left-hand
    # `up` does not, so the join silently matched nothing and this never fired.
    expr: |
      (up{job="risotto"} == 1)
      and on(instance)
      (sum by (instance) (increase(risotto_kafka_messages_total{status="success"}[15m])) == 0)
    for: 1m
    labels:
      severity: critical
    annotations:
      title: 'BMP pipeline has produced no data for 15 minutes'
      description: 'Risotto is up but has sent 0 messages to Kafka in the last 15 minutes. The bmp.updates ClickHouse table is not receiving data.'

- name: pesto
  rules:
  - alert: Pipeline_SFlow_No_Data
    # See Pipeline_BMP_No_Data: bare `and` could not join across the `status`
    # label, so this rule was also inert.
    expr: |
      (up{job="pesto"} == 1)
      and on(instance)
      (sum by (instance) (increase(pesto_kafka_messages_total{status="success"}[15m])) == 0)
    for: 1m
    labels:
      severity: critical
    annotations:
      title: 'sFlow pipeline has produced no data for 15 minutes'
      description: 'Pesto is up but has sent 0 messages to Kafka in the last 15 minutes. The flows.records ClickHouse table is not receiving data.'

- name: saimiris
  rules:
  - alert: Pipeline_Saimiris_Kafka_Broken
    # Fires when an agent is receiving probe replies but not forwarding to Kafka.
    # This catches the case where the pipeline is broken (e.g. Kafka unreachable)
    # without false-positiving when no experiments are actively running.
    #
    # NOTE on the `and on(instance)`: bare `and` matches only series with
    # *identical* label sets. saimiris_kafka_messages_total carries a `status`
    # label that saimiris_receiver_received_total does not, so an unqualified
    # `and` never matched anything and this rule could not fire at all. The
    # sum by (instance) drops `status` and the explicit on(instance) makes the
    # join independent of any future label changes.
    expr: |
      (sum by (instance) (increase(saimiris_receiver_received_total[2h])) > 100)
      and on(instance)
      (sum by (instance) (increase(saimiris_kafka_messages_total{status="success"}[2h])) == 0)
    for: 5m
    labels:
      severity: critical
    annotations:
      title: 'Saimiris agent {{ $labels.instance }} is receiving replies but not sending to Kafka'
      description: 'Saimiris on {{ $labels.instance }} received probe replies but sent 0 messages to Kafka in the last 2 hours. The saimiris.replies ClickHouse table is not receiving data.'

  # Fires when an agent is sending probes but capturing (almost) no replies.
  # This is the inverse of Pipeline_Saimiris_Kafka_Broken and covers the failure
  # mode that rule structurally *cannot*: if the reply path is broken, then
  # saimiris_receiver_received_total never rises, so any rule gated on
  # "received > N" is unfalsifiable and stays silent forever.
  #
  # Incident 2026-07-24: the Vultr IPv6 BGP session on every VLT host had never
  # established (bad next-hop in the BIRD static), so the probing prefixes were
  # unannounced and replies could not route back. ~700M probes/week produced ~30
  # replies and nothing alerted for at least a week. This rule is that detector.
  #
  # Thresholds: saimprowler dispatches every 30min, so a 1h window always spans
  # >=1 batch. A healthy agent sends ~1e8/day and receives >1e5 replies per
  # batch, so "sent >100k but received <100 in an hour" is far outside normal.
  - alert: Pipeline_Saimiris_No_Replies
    expr: |
      (sum by (instance) (increase(saimiris_sender_sent_total[1h])) > 100000)
      and on(instance)
      (sum by (instance) (increase(saimiris_receiver_received_total[1h])) < 100)
    for: 15m
    labels:
      severity: critical
    annotations:
      title: 'Saimiris agent {{ $labels.instance }} is sending probes but receiving no replies'
      description: 'Saimiris on {{ $labels.instance }} sent >100k probes but captured <100 replies in the last hour. The reply path is broken — check that the probing prefixes are announced (BIRD VultrUplink Established and exporting) and globally visible.'

- name: bird
  rules:
  # Fires when a configured BGP session is not Established. bird_exporter reports
  # configured-but-down protocols (unlike BGPalerter / BMP), so this catches
  # chronically-down sessions, not just flaps.
  # peerlab.* sessions are excluded: they are experimental peers that flap by
  # design (covered by PeerLab_Bird_Config_Failing), and they are the only
  # sessions that emit a dual-stack duplicate series with an empty state label.
  - alert: BGP_Session_Down
    expr: bird_protocol_up{proto="BGP", name!~"peerlab.*"} == 0
    for: 10m
    labels:
      severity: warning
    annotations:
      title: 'BGP session {{ $labels.name }} is down on {{ $labels.instance }}'
      description: 'BIRD BGP session {{ $labels.name }} on {{ $labels.instance }} has not been Established for more than 10 minutes (current state: {{ $labels.state }}).'

  # BGP_Session_Down is evaluated over bird_protocol_up. If bird_exporter serves
  # no bird_* metrics at all, that expression has no series and the alert cannot
  # fire — a scraped-but-useless exporter looks identical to "all sessions up".
  # This detector closes that gap: the target answers (up == 1) but publishes no
  # BGP protocol series.
  #
  # Root cause seen in production: bird_exporter bind-mounted the BIRD control
  # socket as a FILE, so restarting BIRD left it holding a deleted inode. Both
  # the ixp and vlt modules now mount the parent directory instead.
  #
  # job="bird" covers all three paths: the core's static scrape, and the IXP/VLT
  # exporters that alloy scrapes locally and relabels to job="bird" before
  # remote_write (alloy's own scrape emits the `up` series for those hosts).
  #
  # Two signals, because they fail differently:
  #  - bird_socket_query_success == 0 is the exporter's own purpose-built
  #    indicator that it could not talk to BIRD. This is what a stale socket
  #    mount looks like (ixpcdg02 sat in exactly this state for 13 days).
  #  - the `unless` arm catches an exporter that publishes nothing useful at
  #    all, where even bird_socket_query_success is missing.
  - alert: Bird_Exporter_No_Metrics
    expr: |
      (bird_socket_query_success == 0)
      or
      (
        (up{job="bird"} == 1)
        unless on(instance)
        (count by (instance) (bird_socket_query_success) > 0)
      )
    for: 10m
    labels:
      severity: critical
    annotations:
      title: 'bird_exporter on {{ $labels.instance }} is up but exporting no BGP metrics'
      description: 'bird_exporter on {{ $labels.instance }} is being scraped successfully but publishes no bird_protocol_up{proto="BGP"} series, so BGP_Session_Down is blind on this host. Usually a stale BIRD control-socket mount — restart the bird_exporter container and check the socket path.'
